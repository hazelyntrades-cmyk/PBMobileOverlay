
name: Build PBMobile Overlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PBMobileOverlay-Android16-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: unzip PBMobileOverlay-Android16-Source.zip

      - name: Build APK
        run: gradle -p PBMobileOverlay assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PBMobileOverlay-debug
          path: PBMobileOverlay/app/build/outputs/apk/debug/app-debug.apk
